  <!-- ============================================================
       BEGIN HEADER  (KO 페이지 공통 — 그대로 복사해 사용)

       페이지별로 변경되는 부분:
       (a) nav-links 안에서 .active + aria-current="page" 위치를 현재 페이지로 옮긴다.
           — ko/index.html  → 첫 번째 <a href="index.html"> 에 적용
           — ko/about.html  → 두 번째 <a href="about.html"> 에 적용
           — ko/contact.html → 세 번째 <a href="contact.html"> 에 적용
           — ko/privacy.html → privacy 는 nav 항목이 없으므로 active 표시 자체를 제거
       (b) 우측 KO/EN 토글의 EN 링크 href 를 같은 페이지의 영문 짝으로 바꾼다.
           예: ko/about.html  ⇒  href="../en/about.html"
           ※ 이 href 는 푸터에도 한 번 더 등장(아래 BEGIN FOOTER 코멘트 참고).
       (c) EN 페이지(en/*.html)에서는 nav 텍스트(홈/소개/문의)와 aria-label 을 영문화하고
           KO/EN 토글의 .on 위치를 EN 으로 옮긴다.
       ============================================================ -->
  <nav class="nav" aria-label="주 메뉴">
    <div class="nav-inner">
      <a href="index.html" class="brand" aria-label="Object — 홈">
        <span class="mark" aria-hidden="true"></span>
        <span>Object<span class="dot" aria-hidden="true">.</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="about.html">소개</a>
        <a href="contact.html" class="active" aria-current="page">문의</a>
      </div>
      <div class="lang" aria-label="언어 선택">
        <span class="on" aria-current="true">KO</span><span class="sep" aria-hidden="true">|</span><a href="../en/contact.html" hreflang="en">EN</a>
      </div>
    </div>
  </nav>
  <!-- END HEADER -->

  <main class="page" id="main" tabindex="-1">
    <div class="wrap">
      <h1 class="display">문의<span class="accent" aria-hidden="true">.</span></h1>
      <p class="lede">협업, 제휴, 문의는 이메일로 보내주세요.</p>

      <section class="email-card" aria-labelledby="email-label">
        <span class="label" id="email-label">메일 주소</span>
        <a class="email" href="mailto:contact@object.so">contact@object.so</a>
        <p class="reply">영업일 기준 1–2일 내 회신드립니다.</p>
      </section>
    </div>
  </main>

  <!-- ============================================================
       BEGIN FOOTER  (KO 페이지 공통 — 그대로 복사해 사용)

       페이지별로 변경되는 부분:
       (a) lang-pair 의 EN 링크 href 를 같은 페이지의 영문 짝으로 바꾼다.
           ※ 헤더와 동일한 값. 두 곳을 모두 같이 갱신할 것.
       (b) EN 페이지에서는 footer 키 라벨(상호/대표/주소/이메일/사업자등록번호/통신판매업신고),
           "사업자정보 확인 ↗", "개인정보처리방침" 텍스트, aria-label("사이트 정보"/"언어 선택"),
           lang-pair 의 .on 위치를 모두 영문 버전으로 교체.
       (c) 통신판매업신고 번호의 한글("부산북구")은 공식 등록명이므로 영문 페이지에서도 그대로 둔다.
       ============================================================ -->
  <footer class="foot" aria-label="사이트 정보">
    <div class="foot-inner">
      <div class="foot-info">
        <div class="row"><span class="k">상호</span><span class="v">오브젝트</span></div>
        <div class="row"><span class="k">대표</span><span class="v">진재명</span></div>
        <div class="row"><span class="k">주소</span><span class="v">부산광역시 북구 상리로 86</span></div>
        <div class="row"><span class="k">이메일</span><span class="v"><a href="mailto:contact@object.so">contact@object.so</a></span></div>
        <div class="row"><span class="k">사업자등록번호</span><span class="v">113-59-00420 <a class="verify" href="https://www.ftc.go.kr/bizCommPop.do?wrkr_no=1135900420" target="_blank" rel="noopener noreferrer">사업자정보 확인 ↗</a></span></div>
        <div class="row"><span class="k">통신판매업신고</span><span class="v">2019-부산북구-0492</span></div>
      </div>
      <div class="foot-bar">
        <div>© <span data-year>2026</span> Object. All rights reserved.</div>
        <div class="links"><a href="privacy.html">개인정보처리방침</a></div>
        <div class="lang-pair" aria-label="언어 선택">
          <span class="on" aria-current="true">KO</span><span class="sep" aria-hidden="true">|</span><a href="../en/contact.html" hreflang="en">EN</a>
        </div>
      </div>
    </div>
  </footer>
  <!-- END FOOTER -->
