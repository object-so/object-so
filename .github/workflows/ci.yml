name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Eleventy and build
        run: |
          npm ci || npm install
          npm run build

      - name: Validate JSON-LD blocks
        run: |
          set -e
          for f in $(find ./_site -name '*.html'); do
            python3 - "$f" <<'PY'
          import re, json, sys
          path = sys.argv[1]
          s = open(path).read()
          for m in re.finditer(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', s, re.S):
              try:
                  json.loads(m.group(1))
              except Exception as e:
                  print(f"INVALID JSON-LD in {path}: {e}")
                  sys.exit(1)
          print(f"OK {path}")
          PY
          done

      - name: Validate sitemap.xml
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          t = ET.parse('_site/sitemap.xml')
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls = t.getroot().findall(ns + 'url')
          assert urls, 'sitemap has no <url> entries'
          print(f'sitemap.xml OK — {len(urls)} URL entries')
          "

      - name: hreflang/canonical/sitemap consistency
        run: python3 scripts/check-hreflang.py

      - name: html-proofer (internal links + favicon)
        uses: chabad360/htmlproofer@v2
        with:
          directory: ./_site
          # 외부 링크는 GitHub runner에서 정부 사이트(ftc.go.kr 등) 접근이
          # 자주 timeout 되므로 disable-external. 외부 링크 health check는
          # 별도 schedule cron으로 분리 운영 (계획 P7-21).
          arguments: |
            --checks Links,Images,Scripts,Favicon
            --disable-external
            --enforce-https
            --ignore-urls "/^http:\/\/localhost/,/^https:\/\/object\.so\//"
            --ignore-files "/naver[0-9a-f]+\.html$/"
