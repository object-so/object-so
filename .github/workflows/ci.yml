name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: SEO artifact gate
        run: npm run check:seo

      - name: html-proofer (internal links + favicon)
        uses: chabad360/htmlproofer@v2
        with:
          directory: ./_site
          # 외부 링크는 GitHub runner에서 정부 사이트(ftc.go.kr 등) 접근이
          # 자주 timeout 되므로 disable-external. 외부 링크 health check는
          # 별도 schedule cron으로 분리 운영 (계획 P7-21).
          arguments: |
            --checks Links,Images,Scripts,Favicon
            --disable-external
            --enforce-https
            --ignore-urls "/^http:\/\/localhost/,/^https:\/\/object\.so\//"
            --ignore-files "/naver[0-9a-f]+\.html$/"
