<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오브젝트 / Object</title>
  <meta name="description" content="오브젝트 / Object — 단일 목적의 앱과 서비스를 만드는 작은 소프트웨어 공방." />
  <meta name="robots" content="noindex" />

  <link rel="canonical" href="https://object.so/ko/index.html" />
  <link rel="alternate" hreflang="ko" href="https://object.so/ko/index.html" />
  <link rel="alternate" hreflang="en" href="https://object.so/en/index.html" />
  <link rel="alternate" hreflang="x-default" href="https://object.so/ko/index.html" />

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

  <!-- Fallback for environments where JS is disabled: default to KO. -->
  <meta http-equiv="refresh" content="0; url=/ko/index.html" />

  <link rel="preload" href="/assets/fonts/Pretendard-Regular.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="/assets/fonts/Pretendard-ExtraBold.otf" as="font" type="font/otf" crossorigin />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <style>
    .root-redirect {
      min-height: 100vh; display: grid; place-items: center;
      padding: 40px 24px; text-align: center;
    }
    .root-redirect h1 {
      font-size: 18px; font-weight: 600;
      letter-spacing: -0.01em; margin: 0 0 16px;
      color: var(--fg-1);
    }
    .root-redirect p { font-size: 14px; color: var(--fg-3); margin: 0 0 24px; }
    .root-redirect .links { display: inline-flex; gap: 12px; }
    .root-redirect .links a {
      padding: 10px 16px; border-radius: var(--radius-sm);
      background: var(--bg-inverse); color: var(--fg-on-inverse);
      font-size: 14px; font-weight: 500;
      text-decoration: none;
    }
    .root-redirect .links a.secondary {
      background: transparent; color: var(--fg-1);
      border: 1px solid var(--border-2);
    }
    .root-redirect .links a:focus-visible {
      outline: 2px solid var(--accent-400); outline-offset: 2px;
    }
  </style>

  <script>
    (function () {
      try {
        var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || 'ko').toLowerCase();
        var target = lang.indexOf('ko') === 0 ? '/ko/index.html' : '/en/index.html';
        location.replace(target);
      } catch (_) {
        location.replace('/ko/index.html');
      }
    })();
  </script>
</head>
<body>
  <main class="root-redirect">
    <div>
      <h1>오브젝트 / Object</h1>
      <p>잠시만요. 언어에 맞는 페이지로 이동합니다. <br/>Redirecting to your language…</p>
      <div class="links">
        <a href="/ko/index.html" hreflang="ko">한국어로 이동</a>
        <a href="/en/index.html" hreflang="en" class="secondary">Continue in English</a>
      </div>
    </div>
  </main>
</body>
</html>
